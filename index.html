<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Latihan Kaiwa & Kanji Mandiri</title>
    <style>
        :root { --primary: #4a90e2; --dark: #333; --light: #f5f7fa; --border: #ccc; }
        body { font-family: sans-serif; margin: 0; padding: 20px; background-color: var(--light); color: var(--dark); }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: var(--primary); }
        textarea { width: 100%; height: 100px; padding: 10px; box-sizing: border-box; border: 2px solid var(--border); border-radius: 6px; font-size: 16px; resize: vertical; }
        button { background-color: var(--primary); color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; margin-top: 10px; width: 100%; }
        button:hover { background-color: #357abd; }
        .kaiwa-display { margin-top: 25px; padding: 15px; border-left: 5px solid var(--primary); background: #fafafa; line-height: 3; font-size: 24px; }
        ruby { ruby-position: over; font-size: 26px; cursor: pointer; padding: 0 4px; border-radius: 4px; }
        ruby:hover { background-color: #e1f5fe; }
        rt { font-size: 13px; color: #666; user-select: none; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 450px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid var(--border); border-radius: 4px; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .btn-close { background-color: #e0e0e0; color: #333; }
    </style>
</head>
<body>
<div class="container">
    <h1>Latihan Kaiwa & Database Kanji Mandiri</h1>
    <div class="form-group">
        <label for="kaiwaInput">Masukkan Teks Jepang / Kalimat Kaiwa:</label>
        <textarea id="kaiwaInput" placeholder="Contoh: 私は日本語を勉強します。"></textarea>
        <button onclick="generateKaiwa()">Proses & Tampilkan Kaiwa</button>
    </div>
    <h2>Hasil Tampilan (Klik Kanji untuk Edit Arti Radikal & Cara Baca)</h2>
    <div id="kaiwaDisplay" class="kaiwa-display">Teks yang Anda proses akan muncul di sini...</div>
</div>

<div id="kanjiModal" class="modal">
    <div class="modal-content">
        <h3 id="modalKanjiTitle">Pengaturan Kanji</h3>
        <div class="form-group">
            <label for="inputFurigana">Cara Baca (Furigana):</label>
            <input type="text" id="inputFurigana" placeholder="Contoh: き">
        </div>
        <div class="form-group">
            <label for="inputRadikal">Arti Radikal (Buatan Sendiri):</label>
            <textarea id="inputRadikal" style="height:80px;" placeholder="Contoh: Pohon"></textarea>
        </div>
        <div class="modal-buttons">
            <button onclick="saveKanjiData()">Simpan Data</button>
            <button class="btn-close" onclick="closeModal()">Batal</button>
        </div>
    </div>
</div>

<script>
    let kanjiDB = JSON.parse(localStorage.getItem('myKanjiDB')) || {};
    let activeKanji = '';
    function isKanji(ch) { return (ch >= '\u4e00' && ch <= '\u9faf') || (ch >= '\u3400' && ch <= '\u4dbf'); }
    function generateKaiwa() {
        const input = document.getElementById('kaiwaInput').value;
        const display = document.getElementById('kaiwaDisplay');
        display.innerHTML = '';
        if(!input.trim()) { display.innerHTML = 'Silakan masukkan teks terlebih dahulu.'; return; }
        for (let char of input) {
            if (isKanji(char)) {
                const data = kanjiDB[char] || { furigana: '', radikal: '' };
                const ruby = document.createElement('ruby');
                ruby.textContent = char;
                ruby.onclick = () => openKanjiModal(char);
                const rt = document.createElement('rt');
                rt.textContent = data.furigana || '';
                if(data.radikal) { ruby.title = `Arti Radikal: ${data.radikal}`; }
                ruby.appendChild(rt);
                display.appendChild(ruby);
            } else {
                display.appendChild(document.createTextNode(char));
            }
        }
    }
    function openKanjiModal(kanji) {
        activeKanji = kanji;
        document.getElementById('modalKanjiTitle').textContent = `Pengaturan Kanji: ${kanji}`;
        const existingData = kanjiDB[kanji] || { furigana: '', radikal: '' };
        document.getElementById('inputFurigana').value = existingData.furigana;
        document.getElementById('inputRadikal').value = existingData.radikal;
        document.getElementById('kanjiModal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('kanjiModal').style.display = 'none'; }
    function saveKanjiData() {
        const furigana = document.getElementById('inputFurigana').value.trim();
        const radikal = document.getElementById('inputRadikal').value.trim();
        kanjiDB[activeKanji] = { furigana, radikal };
        localStorage.setItem('myKanjiDB', JSON.stringify(kanjiDB));
        closeModal();
        generateKaiwa();
    }
</script>
</body>
</html>
